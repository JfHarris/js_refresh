<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
            rel="stylesheet" />
        <title>Carousel Componet</title>

        <style>
            /*
            SPACING SYSTEM (px)
            2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

            FONT SIZE SYSTEM (px)
            10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
            */

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            /*
            Main Color: #087f5b
            Gray: #343a40
            */

            body {
                font-family: "Inter", sans-serif;
                color: #343a40;
                line-height: 1;
                display: flex;
                justify-content: center;
            }

            .pagination {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 200px;
            }

            .btn {
                height: 48px;
                width: 48px;
                border: 2px solid #087f5b;
                border-radius: 50%;
                background: none;
                color: #087f5b;
                cursor: pointer;
                /* display: flex;
                align-items: center;
                justify-content: center; */
            }

            .btn:hover {
                background-color: #087f5b;
            }

            .btn:hover .btn-icon {
                stroke: #fff;
            }

            .btn-icon {
                height: 24px;
                width: 24px;
                stroke: #087f5b;
            }

            .page:link,
            .page:visited {
                font-size: 18px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                text-decoration: none;
                color: #343a40;
            }

            .page:hover,
            .page:active {
                background-color: #087f5b;
                color: #fff;
            }

            .page.current {
                background-color: #087f5b;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="pagination">
            <button class="btn left-btn">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="btn-icon">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </button>
            <a href="#" class="page">1</a>
            <a href="#" class="page">2</a>
            <a href="#" class="page current">3</a>
            <a href="#" class="page">4</a>
            <a href="#" class="page">5</a>
            <a href="#" class="page">6</a>
            <a href="#" class="page">...</a>
            <a href="#" class="page">23</a>
            <button class="btn right-btn">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="btn-icon">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
            </button>
        </div>
    </body>
</html>
